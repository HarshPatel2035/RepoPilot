services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot # local development only
      POSTGRES_DB: repopilot
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://repopilot:repopilot@db:5432/repopilot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models:/home/app/.cache/fastembed

volumes:
  pgdata:
  models:
